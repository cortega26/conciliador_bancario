name: ci
permissions:
  contents: read

on:
  pull_request:

jobs:
  forwardtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install analysis dependencies
        run: python -m pip install pandas numpy scipy pyarrow requests

      - name: Run volatility persistence forward test
        run: python tools/forwardtest_vol_persistence_ephemeral.py
