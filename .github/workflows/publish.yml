name: publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tag matches repo version (fail-closed)
        run: |
          python -m pip install -U pip
          python tools/verify_release_tag.py "${GITHUB_REF_NAME}"

      - name: Build (sdist + wheel)
        run: |
          # Se instala el proyecto, no versiones sueltas de build/twine: es la
          # unica forma de garantizar que se publica exactamente lo que CI
          # valido. Fijar aqui las herramientas permitia que publish.yml quedara
          # atras respecto a ci.yml, que usa .[dev]: con twine 5.1.1 (soporta
          # Metadata hasta 2.3) y hatchling 1.32.4 (emite Metadata 2.5), el
          # chequeo fallaba con "Metadata is missing required fields" y la
          # publicacion a PyPI se caia.
          python -m pip install -e ".[dev]"
          rm -rf dist
          python -m build
          python -m twine check dist/*

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1

  # El job de arriba termina en verde cuando PyPI acepto los archivos. Eso no es
  # lo mismo que "esta publicado y sirve": el indice simple tarda unos minutos en
  # listar la version, y durante esa ventana `pip install bankrecon==X` falla
  # aunque la release exista. Este job espera al indice y despues instala el
  # paquete realmente publicado para probarlo.
  #
  # Sin el, "publicado" era una conclusion del operador. Paso en dos releases de
  # este repo, y las dos veces la respuesta correcta salio de mirar el sha256 a
  # mano.
  verify_published:
    runs-on: ubuntu-latest
    needs: build_and_publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install poppler (lo necesita `concilia init` en el verificador)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils

      - name: Verify the published package
        run: python tools/verify_published.py "${GITHUB_REF_NAME#v}"
