[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "bankrecon"
description = "CLI local para conciliacion bancaria (Chile-first) con auditoria y enfoque fail-closed."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Conciliador Bancario Contributors" }]
keywords = ["conciliacion", "bancaria", "chile", "contabilidad", "cli"]
dynamic = ["version"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
urls = { "Homepage" = "https://tooltician.com", "Repository" = "https://github.com/cortega26/conciliador_bancario", "Issues" = "https://github.com/cortega26/conciliador_bancario/issues", "Changelog" = "https://github.com/cortega26/conciliador_bancario/blob/main/CHANGELOG.md" }
dependencies = [
  "pydantic==2.13.5",
  "typer==0.27.2",
  "rich==15.0.0",
  "PyYAML==6.0.3",
  "openpyxl==3.1.5",
  "pypdf==6.19.0",
  "defusedxml==0.7.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "hypothesis==6.168.3",
  "ruff==0.4.10",
  "black==26.5.1",
  "bandit==1.9.4",
  "pip-audit==2.10.1",
  "build==1.6.1",
  "twine==7.0.0",
  "bump2version==1.0.1",
  "mypy==1.10.0",
  "types-PyYAML==6.0.12.20260906",
  # Stubs de terceros: sin ellos mypy no puede verificar openpyxl ni
  # defusedxml y trata el modulo entero como Any, que es donde se esconden
  # los bugs de contrato (ej. pasar details= a una excepcion que no lo acepta).
  "types-openpyxl==3.1.5.20260827",
  "types-defusedxml==0.7.0.20260504",
  # Fijado para que el gate de supply chain sea reproducible: el runner de CI
  # trae su propia version y sin este pin la auditoria depende de la imagen.
  "setuptools==84.0.0",
  "coverage==7.6.1",
]
pdf_ocr = [
  # Requiere dependencias de sistema (poppler) para convertir PDF->imagenes.
  "pdf2image==1.17.0",
  "pytesseract==0.3.13",
  "Pillow==10.4.0",
]

[project.scripts]
concilia = "conciliador_bancario.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/conciliador_bancario", "src/bankrecon"]
include = [
  "src/conciliador_bancario/templates/*.yaml",
  "src/conciliador_bancario/templates/*.csv",
]

[tool.hatch.version]
path = "src/conciliador_bancario/version.py"

[tool.hatch.build]
exclude = [
  "**/__pycache__/**",
  "**/*.pyc",
]

# Entornos virtuales de verificacion creados dentro del repo (RELEASING.md, CI).
# No son contenido del paquete: son venvs locales, con binarios .exe de Windows
# y una copia propia de pip, que se terminaba publicando en el sdist.
# La regla de .gitignore NO alcanza aqui: hatchling empaqueta lo que git rastrea.
[tool.hatch.build.targets.sdist]
exclude = [
  "**/.pypi_smoke/**",
  "**/.smoke_venv/**",
  "**/.hypothesis/**",
  "**/dist/**",
  "**/build/**",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
filterwarnings = [
  # openpyxl triggers a deprecation warning on Python 3.12; keep tests signal-focused.
  "ignore:datetime\\.datetime\\.utcnow\\(\\) is deprecated.*:DeprecationWarning:openpyxl\\.packaging\\.core",
  "ignore:datetime\\.datetime\\.utcnow\\(\\) is deprecated.*:DeprecationWarning:openpyxl\\.writer\\.excel",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  # Black-compatible: don't fight long literals/URLs. Black doesn't reflow strings.
  "E501",
  # Small refactor suggestion with no practical benefit here.
  "UP038",
]

[tool.ruff.lint.per-file-ignores]
# Typer encourages Option(...) in defaults; this is intentional for CLI ergonomics.
"src/conciliador_bancario/cli/app.py" = ["B008", "UP007"]
# Tests sometimes intentionally assert broad exceptions for contract/fail-closed behaviour.
"tests/**/*.py" = ["B017"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.coverage.run]
# Se mide con ramas: una linea cubierta puede esconder un `if` nunca tomado, que
# es justo donde viven los defaults dangerousos (match/bloqueo/ventanas).
branch = true
source = ["src/conciliador_bancario"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.",
]
# Ratchet: solo puede subir. Se fijo en 88 porque la medicion esta en 89, dejando
# un punto de holgura para refactors legitimos; si cae, el gate exige tests.
fail_under = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
# Un `# type: ignore` que deja de ser necesario es ruido que se pudre: con esto
# mypy lo reporta y hay que borrarlo o justificarlo de nuevo.
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
