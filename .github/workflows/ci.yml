name: ci
permissions:
  contents: read

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # El guard de changelog compara contra el ultimo tag, asi que necesita
          # el historial y los tags; el checkout shallow no los trae.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev]"

      - name: Format (black)
        run: python -m black --check src tests tools

      - name: Lint (ruff)
        run: python -m ruff check src tests tools

      # mypy estaba declarado pero fuera de CI. Esa decision es la que dejo pasar
      # un bug real: ErrorIngestion no aceptaba details=/hint= y el raise reventaba
      # con TypeError en vez de reportar el error. Configurado en pyproject.toml.
      - name: Types (mypy)
        run: python -m mypy src

      - name: Changelog (merge commits no duplican entradas)
        run: python tools/check_changelog_commits.py

      - name: Security (bandit)
        run: python -m bandit -c .bandit.yml -r src

      - name: Security (semgrep)
        run: |
          docker run --rm -v "$(pwd):/src" -w /src returntocorp/semgrep:1.95.0 \
            semgrep scan --config .semgrep.yml --error --metrics=off src

      - name: Supply chain (pip-audit)
        run: python tools/pip_audit_gate.py

      - name: Tests
        run: python -m pytest -q

      # Ratchet de cobertura: solo puede subir (fail_under en pyproject.toml).
      # Se mide con ramas porque una linea cubierta puede esconder un `if` nunca
      # tomado, que es donde viven los defaults de match/bloqueo/ventanas.
      - name: Coverage floor (no puede bajar)
        run: |
          coverage run -m pytest -q
          coverage report

      - name: Build (sdist + wheel)
        run: python -m build

      - name: Verify dist (twine check)
        run: python -m twine check dist/*

  wheel_smoke:
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        run: |
          python -m pip install -U pip
          # Mismo criterio que publish.yml: se instala el proyecto para que el
          # build use el backend y el front-end fijados en pyproject, no una
          # version suelta que puede quedar atras respecto al job de test.
          python -m pip install -e ".[dev]"
          python -m build

      - name: Install-from-wheel smoke
        run: |
          python -m venv .smoke_venv
          .smoke_venv/bin/python -m pip install -U pip
          .smoke_venv/bin/pip install dist/*.whl
          .smoke_venv/bin/python -c "import bankrecon as br; import conciliador_bancario as cb; from conciliador_bancario.core import premium_contracts as pc; print(br.__version__); assert br.__version__ == cb.__version__; assert pc.RUN_JSON_SCHEMA_VERSION"
          .smoke_venv/bin/concilia --help

  pdf_ocr:
    # El job de test instala solo .[dev], asi que pdf2image/pytesseract/Pillow
    # nunca se instalaban y la ruta OCR no se ejecutaba en ningun run: por eso un
    # bump mayor de Pillow (Dependabot #11) no tenia nada que validarlo. Este job
    # instala los extras y los binarios de sistema para ejercitar la costura real.
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install OCR system deps (poppler + tesseract spa)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-spa
          tesseract --list-langs | grep -qx spa

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[dev,pdf_ocr]"

      - name: OCR toolchain is present
        run: |
          python -c "import pdf2image, pytesseract, PIL; print('extras ok')"
          tesseract --version | head -1
          pdftoppm -v 2>&1 | head -1

      - name: Tests (incluye integracion OCR real)
        run: python -m pytest -q -rs

      - name: El golden OCR no debe quedar en skip
        # El golden con stubs debe seguir pasando; lo que no puede pasar es que
        # los tests de integracion se salten por falta de toolchain.
        # Solo `if`: con `bash -e`, un `grep -q` suelto que no coincide devuelve
        # 1 y tumbaria el step en el caso de exito. La condicion de un `if` esta
        # exenta de -e, asi que aca el camino correcto sale con 0.
        run: |
          out=$(python -m pytest tests/test_ingestion_pdf_ocr.py -q -rs 2>&1)
          echo "$out"
          if echo "$out" | grep -q "Requiere extras \[pdf_ocr\]"; then
            echo "::error::los tests de integracion OCR se saltaron: toolchain incompleta"
            exit 1
          else
            echo "OK: los tests de integracion OCR corrieron de verdad"
          fi

  release:
    # Deprecated:
    # Releases are now handled by `.github/workflows/release-please.yml`.
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Deprecated: releases are handled by Release Please (.github/workflows/release-please.yml)."
